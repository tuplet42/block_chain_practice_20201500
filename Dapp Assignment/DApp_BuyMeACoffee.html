<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StableCoin Coffee DApp on GIWA</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f3ee; margin:0; padding:32px; color:#2d1f14; }
    .container { max-width: 900px; margin: 0 auto; background:white; border-radius:20px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    button { border:0; border-radius:12px; padding:12px 16px; margin:6px; cursor:pointer; font-weight:700; background:#8b5e34; color:white; }
    button.secondary { background:#2d1f14; }
    input { width:100%; box-sizing:border-box; padding:12px; border:1px solid #d8c4ad; border-radius:12px; margin:8px 0 12px; }
    .card { background:#fff8f0; border:1px solid #ead8c3; border-radius:14px; padding:16px; margin:14px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .muted { color:#6f6256; font-size:14px; word-break:break-all; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { border-bottom:1px solid #ead8c3; padding:10px; text-align:left; font-size:14px; word-break:break-all; vertical-align:top; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .stat { background:white; border-radius:12px; padding:14px; border:1px solid #ead8c3; }
    .notice { background:#fff; border-left:5px solid #8b5e34; padding:12px; border-radius:10px; margin:12px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>☕ StableCoin Coffee DApp on GIWA</h1>
    <p class="muted">나만의 스테이블코인으로 커피 후원하기 / GIWA Sepolia / MetaMask / ethers.js</p>

    <div class="card">
      <button id="connectBtn">MetaMask 지갑 연결</button>
      <p>연결 주소: <span id="account" class="muted">아직 연결되지 않음</span></p>
      <p>Owner: <span id="owner" class="muted">-</span></p>
      <p>토큰 심볼: <span id="tokenSymbol" class="muted">-</span></p>
      <p>내 토큰 잔액: <span id="userTokenBalance" class="muted">-</span></p>
    </div>

    <div class="card stats">
      <div class="stat">컨트랙트 토큰 잔액<br><strong id="balance">-</strong></div>
      <div class="stat">누적 후원 금액<br><strong id="totalAmount">-</strong></div>
      <div class="stat">후원 횟수<br><strong id="donationCount">-</strong> 회</div>
    </div>

    <div class="card">
      <h2>커피 후원하기</h2>
      <label for="message">응원 메시지</label>
      <input id="message" maxlength="100" placeholder="예: 좋은 DApp 기대합니다!" />
      <div class="row">
        <button onclick="buyCoffee('1')">Small Coffee 1 MSC</button>
        <button onclick="buyCoffee('5')">Medium Coffee 5 MSC</button>
        <button onclick="buyCoffee('10')">Large Coffee 10 MSC</button>
      </div>
      <p id="status" class="muted"></p>
    </div>

    <div class="card" id="ownerPanel" style="display:none;">
      <h2>Owner 전용</h2>
      <button class="secondary" onclick="withdraw()">컨트랙트 토큰 출금</button>
    </div>

    <div class="card">
      <h2>후원 내역</h2>
      <button class="secondary" onclick="loadDonations()">후원 내역 새로고침</button>
      <table>
        <thead>
          <tr><th>후원자</th><th>금액</th><th>메시지</th><th>시간</th></tr>
        </thead>
        <tbody id="donationList"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ================================
    // 내일 다시 배포하면 여기 2개만 바꾸면 됨
    // ================================

    // 1. MyStableCoin 배포 주소
    const TOKEN_ADDRESS = "0xcB8788001Aa5f76E4bfDe07DDf52a457a2926BA6";

    // 2. BuyMeACoffeeStable 배포 주소
    const CONTRACT_ADDRESS = "0xbF7894c68187d718bb1CB96870FFfb74953Fb83D";

    // GIWA Sepolia Chain ID
    // MetaMask에서 chain id가 91342라면 16진수는 0x164CE
    const GIWA_CHAIN_ID = "0x164CE";

    const TOKEN_ABI = [
      "function approve(address spender, uint256 amount) external returns (bool)",
      "function balanceOf(address account) external view returns (uint256)",
      "function decimals() external view returns (uint8)",
      "function symbol() external view returns (string)"
    ];

    const CONTRACT_ABI = [
      {
        "inputs": [{"internalType": "address", "name": "_stableCoin", "type": "address"}],
        "stateMutability": "nonpayable",
        "type": "constructor"
      },
      {
        "anonymous": false,
        "inputs": [
          {"indexed": true, "internalType": "address", "name": "donor", "type": "address"},
          {"indexed": false, "internalType": "uint256", "name": "amount", "type": "uint256"},
          {"indexed": false, "internalType": "string", "name": "message", "type": "string"},
          {"indexed": false, "internalType": "uint256", "name": "timestamp", "type": "uint256"}
        ],
        "name": "Donated",
        "type": "event"
      },
      {
        "anonymous": false,
        "inputs": [
          {"indexed": true, "internalType": "address", "name": "owner", "type": "address"},
          {"indexed": false, "internalType": "uint256", "name": "amount", "type": "uint256"}
        ],
        "name": "Withdrawn",
        "type": "event"
      },
      {
        "inputs": [
          {"internalType": "uint256", "name": "amount", "type": "uint256"},
          {"internalType": "string", "name": "message", "type": "string"}
        ],
        "name": "buyCoffee",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "getBalance",
        "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "getDonationCount",
        "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "getDonations",
        "outputs": [
          {
            "components": [
              {"internalType": "address", "name": "donor", "type": "address"},
              {"internalType": "uint256", "name": "amount", "type": "uint256"},
              {"internalType": "string", "name": "message", "type": "string"},
              {"internalType": "uint256", "name": "timestamp", "type": "uint256"}
            ],
            "internalType": "struct BuyMeACoffeeStable.Donation[]",
            "name": "",
            "type": "tuple[]"
          }
        ],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "owner",
        "outputs": [{"internalType": "address", "name": "", "type": "address"}],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "stableCoin",
        "outputs": [{"internalType": "contract IERC20", "name": "", "type": "address"}],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "totalDonationAmount",
        "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "withdraw",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      }
    ];

    let provider, signer, contract, tokenContract, currentAccount;
    let tokenDecimals = 18;
    let tokenSymbol = "MSC";

    document.getElementById("connectBtn").onclick = connectWallet;

    function checkAddressSetting() {
      if (!ethers.isAddress(TOKEN_ADDRESS) || !ethers.isAddress(CONTRACT_ADDRESS)) {
        throw new Error("HTML 상단의 TOKEN_ADDRESS와 CONTRACT_ADDRESS를 실제 배포 주소로 바꿔주세요.");
      }
    }

    async function switchToGiwa() {
      const currentChainId = await window.ethereum.request({ method: "eth_chainId" });

      if (currentChainId !== GIWA_CHAIN_ID) {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: GIWA_CHAIN_ID }]
        });
      }
    }

    async function connectWallet() {
      try {
        if (!window.ethereum) return alert("MetaMask를 설치해주세요.");

        checkAddressSetting();
        await switchToGiwa();

        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);

        signer = await provider.getSigner();
        currentAccount = await signer.getAddress();

        tokenContract = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, signer);
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

        tokenDecimals = await tokenContract.decimals();
        tokenSymbol = await tokenContract.symbol();

        document.getElementById("account").innerText = currentAccount;
        document.getElementById("tokenSymbol").innerText = tokenSymbol;

        await refreshInfo();
        await loadDonations();
      } catch (e) {
        document.getElementById("status").innerText = "오류: " + (e.shortMessage || e.message);
      }
    }

    async function refreshInfo() {
      const balance = await contract.getBalance();
      const owner = await contract.owner();
      const totalAmount = await contract.totalDonationAmount();
      const donationCount = await contract.getDonationCount();
      const userTokenBalance = await tokenContract.balanceOf(currentAccount);

      document.getElementById("balance").innerText =
        `${ethers.formatUnits(balance, tokenDecimals)} ${tokenSymbol}`;

      document.getElementById("owner").innerText = owner;

      document.getElementById("totalAmount").innerText =
        `${ethers.formatUnits(totalAmount, tokenDecimals)} ${tokenSymbol}`;

      document.getElementById("donationCount").innerText = donationCount.toString();

      document.getElementById("userTokenBalance").innerText =
        `${ethers.formatUnits(userTokenBalance, tokenDecimals)} ${tokenSymbol}`;

      document.getElementById("ownerPanel").style.display =
        owner.toLowerCase() === currentAccount.toLowerCase() ? "block" : "none";
    }

    async function buyCoffee(amount) {
      try {
        checkAddressSetting();
        await switchToGiwa();

        if (!contract || !tokenContract) {
          throw new Error("먼저 MetaMask 지갑을 연결해주세요.");
        }

        const message = document.getElementById("message").value || "Thanks for your work!";
        const tokenAmount = ethers.parseUnits(amount, tokenDecimals);

        document.getElementById("status").innerText =
          `1단계: ${amount} ${tokenSymbol} 사용 승인 요청 중...`;

        const approveTx = await tokenContract.approve(CONTRACT_ADDRESS, tokenAmount);

        document.getElementById("status").innerText =
          "approve 처리 중: " + approveTx.hash;

        await approveTx.wait();

        document.getElementById("status").innerText =
          "2단계: 후원 트랜잭션 승인 대기 중...";

        const tx = await contract.buyCoffee(tokenAmount, message);

        document.getElementById("status").innerText =
          "후원 처리 중: " + tx.hash;

        await tx.wait();

        document.getElementById("status").innerText =
          "후원 완료! TX: " + tx.hash;

        document.getElementById("message").value = "";

        await refreshInfo();
        await loadDonations();
      } catch (e) {
        document.getElementById("status").innerText = "오류: " + (e.shortMessage || e.message);
      }
    }

    async function loadDonations() {
      if (!contract) return;

      const donations = await contract.getDonations();
      const tbody = document.getElementById("donationList");

      tbody.innerHTML = "";

      const donationArray = Array.from(donations).reverse();

      donationArray.forEach(d => {
        const time = new Date(Number(d.timestamp) * 1000).toLocaleString();

        tbody.innerHTML += `
          <tr>
            <td>${d.donor}</td>
            <td>${ethers.formatUnits(d.amount, tokenDecimals)} ${tokenSymbol}</td>
            <td>${escapeHtml(d.message)}</td>
            <td>${time}</td>
          </tr>`;
      });
    }

    async function withdraw() {
      try {
        checkAddressSetting();
        await switchToGiwa();

        if (!contract) {
          throw new Error("먼저 MetaMask 지갑을 연결해주세요.");
        }

        const tx = await contract.withdraw();

        document.getElementById("status").innerText =
          "출금 처리 중: " + tx.hash;

        await tx.wait();

        document.getElementById("status").innerText = "출금 완료!";

        await refreshInfo();
      } catch (e) {
        document.getElementById("status").innerText = "오류: " + (e.shortMessage || e.message);
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>'"]/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[c]));
    }
  </script>
</body>
</html>
